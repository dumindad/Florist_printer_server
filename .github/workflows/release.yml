name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: pwsh
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $env:GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build standalone exe + installer
        run: pnpm release

      - name: Determine package name
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $zipName = "pos-printer-server-v$version.zip"
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_NAME=$zipName"
          Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_PATH=dist/$zipName"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: POS Printer Server ${{ github.ref_name }}
          body_path: version.json
          files: ${{ env.PACKAGE_PATH }}
          generate_release_notes: true
